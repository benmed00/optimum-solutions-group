openapi: 3.1.0

info:
  title: Optimum Solutions Group API
  description: |
    RESTful API for Optimum Solutions Group platform.
    Covers authentication, user management, contact forms, analytics, and content.
  version: 1.0.0
  contact:
    name: API Support
    email: hello@optimumsolutions.com
  license:
    name: Proprietary
    url: https://optimumsolutions.com/terms

servers:
  - url: https://api.optimumsolutions.com/v1
    description: Production
  - url: https://api.staging.optimumsolutions.com/v1
    description: Staging
  - url: http://localhost:8080/api
    description: Local dev (npm run dev)
  - url: http://localhost:4173/api
    description: Local preview (npm run preview)

tags:
  - name: Authentication
    description: Login, registration, token management
  - name: Users
    description: User profile and management
  - name: Contact
    description: Contact form submissions
  - name: Analytics
    description: Analytics events and performance metrics
  - name: Content
    description: Posts and content management

paths:
  # =============================================================================
  # AUTHENTICATION
  # =============================================================================

  /auth/login:
    post:
      operationId: authLogin
      summary: Authenticate user
      description: Returns JWT access token and user profile on successful credentials.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
            examples:
              validCredentials:
                summary: Valid user credentials
                value:
                  email: user@example.com
                  password: user123
              adminCredentials:
                summary: Admin user credentials
                value:
                  email: admin@example.com
                  password: admin123
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
              examples:
                success:
                  summary: Successful login
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    expiresIn: 3600
                    user:
                      id: 1
                      email: user@example.com
                      firstName: Test
                      lastName: User
                      role: user
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/register:
    post:
      operationId: authRegister
      summary: Register new user
      description: Creates a new user account. Email must be unique.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
            example:
              firstName: Jane
              lastName: Smith
              email: jane.smith@example.com
              password: SecurePass123!
              confirmPassword: SecurePass123!
              agreeToTerms: true
              newsletter: false
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Refresh access token
      description: Exchanges a valid refresh token for a new access token.
      tags: [Authentication]
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Current refresh token
      responses:
        '200':
          description: New tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  refreshToken:
                    type: string
                  expiresIn:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      operationId: authLogout
      summary: Invalidate session
      description: Logs out the current user and invalidates tokens.
      tags: [Authentication]
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Logged out successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =============================================================================
  # USERS
  # =============================================================================

  /user/profile:
    get:
      operationId: userGetProfile
      summary: Get current user profile
      tags: [Users]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      operationId: userUpdateProfile
      summary: Update current user profile
      tags: [Users]
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      operationId: usersList
      summary: List users (admin)
      description: Paginated list of users. Requires admin role.
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: role
          in: query
          schema:
            type: string
            enum: [user, admin, guest]
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      operationId: usersCreate
      summary: Create user (admin)
      tags: [Users]
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserIdParam'
    get:
      operationId: usersGetById
      summary: Get user by ID
      tags: [Users]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: usersUpdateById
      summary: Update user by ID
      tags: [Users]
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: usersDeleteById
      summary: Delete user
      tags: [Users]
      security:
        - BearerAuth: []
      responses:
        '204':
          description: User deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # =============================================================================
  # CONTACT
  # =============================================================================

  /contact:
    post:
      operationId: contactSubmit
      summary: Submit contact form
      description: |
        Submits a consultation request. Used by the contact section form.
        Supports offline queue via service worker.
      tags: [Contact]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactSubmitRequest'
            examples:
              consultationRequest:
                summary: Full consultation request
                value:
                  name: John Smith
                  email: john@company.com
                  company: Acme Inc
                  phone: "+1 (555) 123-4567"
                  projectType: web-app
                  budget: "$10k-$25k"
                  message: "We need a custom web application for inventory management."
                  timeline: asap
      responses:
        '201':
          description: Form submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSubmitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'

  # =============================================================================
  # ANALYTICS
  # =============================================================================

  /analytics:
    post:
      operationId: analyticsSubmitEvents
      summary: Submit analytics events batch
      description: |
        Receives batched analytics events from the client.
        Used by service worker for offline sync and analytics service flush.
      tags: [Analytics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsEventsBatch'
      responses:
        '202':
          description: Events accepted for processing
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/performance:
    post:
      operationId: analyticsSubmitPerformance
      summary: Submit performance metrics
      description: |
        Receives Core Web Vitals and custom performance metrics.
        Sent by performance monitor in production.
      tags: [Analytics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformanceMetricsRequest'
      responses:
        '202':
          description: Metrics accepted
        '400':
          $ref: '#/components/responses/BadRequest'

  /analytics/report:
    get:
      operationId: analyticsGetReport
      summary: Get analytics report
      description: |
        Returns aggregated analytics for the dashboard.
        Used by useAnalyticsData hook.
      tags: [Analytics]
      security:
        - BearerAuth: []
      parameters:
        - name: range
          in: query
          required: true
          schema:
            type: string
            enum: [1h, 24h, 7d, 30d, 90d]
            default: 24h
      responses:
        '200':
          description: Analytics report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsReport'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =============================================================================
  # CONTENT (POSTS)
  # =============================================================================

  /posts:
    get:
      operationId: postsList
      summary: List posts
      tags: [Content]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, published, archived]
      responses:
        '200':
          description: Paginated posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      operationId: postsCreate
      summary: Create post
      tags: [Content]
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreateRequest'
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /posts/{postId}:
    parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: postsGetById
      summary: Get post by ID
      tags: [Content]
      responses:
        '200':
          description: Post details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: postsUpdateById
      summary: Update post
      tags: [Content]
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUpdateRequest'
      responses:
        '200':
          description: Post updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: postsDeleteById
      summary: Delete post
      tags: [Content]
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Post deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from login

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Invalid request body or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Invalid credentials
            code: UNAUTHORIZED
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # Auth
    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 6

    AuthLoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT access token
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Token TTL in seconds
        user:
          $ref: '#/components/schemas/UserProfile'

    AuthRegisterRequest:
      type: object
      required: [firstName, lastName, email, password, confirmPassword, agreeToTerms]
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        confirmPassword:
          type: string
        agreeToTerms:
          type: boolean
        newsletter:
          type: boolean
          default: false

    AuthRegisterResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        token:
          type: string

    # Users
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [user, admin, guest]
        displayName:
          type: string
        bio:
          type: string
        website:
          type: string
          format: uri
        location:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserProfileUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        displayName:
          type: string
        bio:
          type: string
        website:
          type: string
        location:
          type: string

    UserCreateRequest:
      allOf:
        - $ref: '#/components/schemas/UserProfileUpdate'
        - type: object
          required: [email, password]
          properties:
            email:
              type: string
              format: email
            password:
              type: string
            role:
              type: string
              enum: [user, admin, guest]

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserProfile'
        meta:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer

    # Contact
    ContactSubmitRequest:
      type: object
      required: [name, email, message]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        company:
          type: string
        phone:
          type: string
        projectType:
          type: string
          enum: [web-app, mobile-app, automation, crm, analytics, integration, other]
        budget:
          type: string
        message:
          type: string
          minLength: 10
        timeline:
          type: string
          enum: [asap, quarter, year, planning]

    ContactSubmitResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        message:
          type: string
          example: "Thank you. We'll respond within 24 hours."

    # Analytics
    AnalyticsEventsBatch:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsEvent'
        session:
          $ref: '#/components/schemas/AnalyticsSession'
        metadata:
          type: object
          properties:
            timestamp:
              type: integer
            version:
              type: string

    AnalyticsEvent:
      type: object
      properties:
        type:
          type: string
        category:
          type: string
        action:
          type: string
        label:
          type: string
        value:
          type: number
        timestamp:
          type: integer
        sessionId:
          type: string
        url:
          type: string
        referrer:
          type: string
        title:
          type: string
        userAgent:
          type: string
        properties:
          type: object

    AnalyticsSession:
      type: object
      properties:
        id:
          type: string
        startTime:
          type: integer
        pageViews:
          type: integer
        interactions:
          type: integer
        duration:
          type: integer

    PerformanceMetricsRequest:
      type: object
      required: [metrics]
      properties:
        metrics:
          type: object
          additionalProperties:
            type: number
        userAgent:
          type: string
        url:
          type: string
        timestamp:
          type: integer

    AnalyticsReport:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsEvent'
        session:
          $ref: '#/components/schemas/AnalyticsSession'
        metrics:
          type: object
          properties:
            totalPageViews:
              type: integer
            uniqueVisitors:
              type: integer
            averageSessionDuration:
              type: number
            bounceRate:
              type: number
            totalEvents:
              type: integer
            conversionRate:
              type: number
        deviceBreakdown:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: integer
              percentage:
                type: number
        topPages:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              views:
                type: integer
              time:
                type: number
        timeSeriesData:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
              events:
                type: integer
              users:
                type: integer
        performanceMetrics:
          type: object
          properties:
            avgLCP:
              type: number
            avgFID:
              type: number
            avgCLS:
              type: number
            avgFCP:
              type: number
            avgTTFB:
              type: number

    # Content
    Post:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        excerpt:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        authorId:
          type: integer
        publishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PostCreateRequest:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        excerpt:
          type: string
        status:
          type: string
          enum: [draft, published, archived]

    PostUpdateRequest:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        excerpt:
          type: string
        status:
          type: string
          enum: [draft, published, archived]

    PostListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        meta:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer

    # Common
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: array
          items:
            type: object
